---
- name: Install fail2ban
  register: fail2ban_install
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure the sshd jail and home-zone whitelist
  ansible.builtin.template:
    src: 00-home.local.j2
    dest: /etc/fail2ban/jail.d/00-home.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Switch off stale jails from older setups
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/zz-homelab-disabled.local
    content: |
      # Managed by Ansible (Homelab-as-Code)
      {% for jail in fail2ban_disabled_jails %}
      [{{ jail }}]
      enabled = false
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: fail2ban_disabled_jails | length > 0
  notify: Restart fail2ban

# fail2ban refuses to start if ANY jail is broken, including ones this role
# doesn't manage. Test the whole config before the restart handler runs, and
# in --check too, so a dry run catches it.
- name: Test the full fail2ban config
  ansible.builtin.command: fail2ban-client -t
  register: fail2ban_test
  changed_when: false
  check_mode: false
  failed_when: fail2ban_test.rc != 0
  # On a fresh host in --check, fail2ban isn't installed yet
  when: not (ansible_check_mode and fail2ban_install is changed)

- name: Start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
