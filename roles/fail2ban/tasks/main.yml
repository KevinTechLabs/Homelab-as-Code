---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure the sshd jail and home-zone whitelist
  ansible.builtin.template:
    src: 00-home.local.j2
    dest: /etc/fail2ban/jail.d/00-home.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
