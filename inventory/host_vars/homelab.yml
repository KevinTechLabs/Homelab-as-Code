---
# MINISFORUM X1 Lite-255: Docker host for Sentinel, Wazuh, Uptime Kuma,
# Portainer and the CI/CD app. Rules match network/server-hardening.md.
ufw_rules:
  - {rule: allow, port: "22", proto: tcp, comment: "SSH (key-only)"}
  - {rule: allow, port: "8088", proto: tcp, comment: "Sentinel dashboard"}
  - {rule: allow, port: "1514:1515", proto: tcp, from: "{{ net_servers }}", comment: "Wazuh agents (Servers)"}
  - {rule: allow, port: "1514:1515", proto: tcp, from: "{{ net_trusted }}", comment: "Wazuh agents (Trusted)"}
  - {rule: allow, port: "1514:1515", proto: tcp, from: "{{ kali_lan_ip }}", comment: "Wazuh agent (Kali, /32 exception)"}
  - {rule: allow, port: "1514:1515", proto: tcp, from: "{{ vault_lan_ip }}", comment: "Wazuh agent (vault, /32 exception)"}
  - {rule: allow, port: "5140", proto: udp, from: "{{ pfsense_lan_ip }}", comment: "pfSense syslog into Sentinel"}
  - {rule: allow, interface: tailscale0, direction: in, comment: "Tailscale"}

# Docker publishes ports through its own iptables chains and skips ufw.
# Portainer is root-equivalent, so it is limited to Trusted in DOCKER-USER.
ufw_docker_user_rules:
  - {port: 9443, from: "{{ net_trusted }}"}
ufw_docker_uplink: enp1s0

docker_portainer_enabled: true

# Ubuntu 26.04 ships sudo-rs as `sudo`. Its password prompt isn't one Ansible
# recognizes, so become times out. The classic sudo is still installed as sudo.ws.
ansible_become_exe: sudo.ws

# Leftover jail from when Vaultwarden ran here (it moved to the vault Pi).
# Its log file is gone, so fail2ban refused to start at all.
fail2ban_disabled_jails: [vaultwarden]
