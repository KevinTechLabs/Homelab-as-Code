---
# Example addressing only (10.20.0.0/16), matching the Desk-Pi-Rack docs.
# Real addresses, usernames and keys are never committed.
#
# Groups describe what a host *is*; host_vars describe what makes it different.
all:
  children:
    servers:            # Servers zone, VLAN 1 untagged, 10.20.1.0/24
      hosts:
        homelab:        # MINISFORUM X1 Lite-255, Ubuntu Server 26.04
          ansible_host: 10.20.1.20
        aiserver:       # i5-13600K / RTX 4070, Ubuntu 26.04
          ansible_host: 10.20.1.30
        pihole:         # Raspberry Pi 5, Debian 13
          ansible_host: 10.20.1.53
    lab:                # Lab zone, VLAN 40, internet + DNS only
      hosts:
        kali:           # Beelink EQ, Kali Linux
          ansible_host: 10.20.40.10
    vault_zone:         # Vault zone, own pfSense port, Tailscale-only access
      hosts:
        vault:          # Raspberry Pi 5, Raspberry Pi OS Lite (Trixie)
          # Nothing on the LAN can reach the vault, so Ansible connects over
          # Tailscale (MagicDNS name), the same way an admin would.
          ansible_host: vault
    docker_hosts:
      hosts:
        homelab:
        aiserver:
        kali:           # DVWA lab target, published on loopback only
        vault:
    wazuh_agents:
      hosts:
        homelab:
        aiserver:
        pihole:
        kali:
        vault:
