---
# Public defaults, using the example 10.20.x.x plan from the Desk-Pi-Rack docs.
#
# Real values go in site.yml in this folder (git-ignored, template:
# site.yml.example). Files here load in name order, so site.yml overrides
# this file. Secrets go in vault.yml, encrypted with ansible-vault.

# The account Ansible logs in as, and the only one allowed to SSH in
# admin_user is the default; site_users (in site.yml) overrides it per host,
# for machines where the login name differs.
admin_user: kevin
site_users: {}
ansible_user: "{{ site_users[inventory_hostname] | default(admin_user) }}"
# Servers stay on UTC so SIEM and firewall logs line up across hosts
timezone: Etc/UTC

# Host addresses: hosts.yml reads site_addresses.<host> and falls back to the
# example address. The vault defaults to its Tailscale name.
site_addresses: {}

# Subnets
net_servers: 10.20.1.0/24
net_trusted: 10.20.10.0/24
net_lab: 10.20.40.0/24
net_vault: 10.20.60.0/24
net_tailscale: 100.64.0.0/10
pfsense_lan_ip: 10.20.1.1
wazuh_agent_manager_ip: 10.20.1.20      # Wazuh runs in Docker on the home lab server

# The two single-host exceptions allowed to reach the Wazuh manager
kali_lan_ip: 10.20.40.10
vault_lan_ip: 10.20.60.10

# SSH: keys only, root off, only the admin account may log in
ssh_allow_users: ["{{ ansible_user }}"]

# fail2ban: home zones are whitelisted so a typo from the desktop can't lock
# it out. IoT, Lab and Guest are deliberately NOT whitelisted.
fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - "{{ net_servers }}"
  - "{{ net_trusted }}"
  - "{{ net_tailscale }}"

# ufw: every host starts from default deny inbound. host_vars add the rules.
ufw_rules: []

# Wazuh agent pinned to the manager's version and held, so rolling distros
# (Kali) can't upgrade the agent past the manager.
wazuh_agent_version: 4.14.8
wazuh_agent_active_response_disabled: false

# Tailscale: servers are tag:server, the vault is tag:vault.
tailscale_tags: ["tag:server"]
